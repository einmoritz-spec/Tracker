<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tracker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3C2E6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">

<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/appletouchicon.png">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>

<!--
  Klassische <script>-Tags ohne "defer"/"type=module": alle Dateien teilen
  sich einen globalen Scope, spätere Dateien greifen direkt auf Funktionen/
  Variablen früherer Dateien zu. Die Ladereihenfolge ist deshalb verbindlich
  und entspricht der Nummerierung 01–14 (Lücken = noch nicht angelegte
  Module für Chart/Stats-Detailinhalte, siehe TODO in 06-navigation.js).
-->
<script src="js/data/app-data.js"></script>
<script src="js/01-storage.js"></script>
<script src="js/02-state-theme.js"></script>
<script src="js/04-utils.js"></script>
<script src="js/05-calendar.js"></script>
<script src="js/06-navigation.js"></script>
<script src="js/07-import.js"></script>
<script src="js/09-stats-progress.js"></script>
<script src="js/14-app-init.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}
</script>
</body>
</html>
